services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    entrypoint:
      - /bin/bash
      - -c
      - |
        until mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; do sleep 1; done
        mongosh --host mongo:27017 --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }'

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:10000"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      web:
        condition: service_started

  init-job:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    command: ["python", "-c", "import asyncio; from backend.init_jobs import run_init_job; asyncio.run(run_init_job())"]
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  mongo-data:
  redis-data:
