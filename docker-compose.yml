services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:10000"
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
      - redis
      - web

  init-job:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-secret
      FRONTEND_ORIGIN: http://localhost:5173
    command: ["python", "-c", "import asyncio; from backend.init_jobs import run_init_job; asyncio.run(run_init_job())"]
    depends_on:
      - mongo
      - redis

volumes:
  mongo-data:
  redis-data:
