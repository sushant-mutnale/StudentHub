[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[tool:coverage.run]
source = backend
omit =
    backend/tests/*
    backend/venv/*
    */node_modules/*

[tool:coverage.report]
show_missing = true
fail_under = 0
