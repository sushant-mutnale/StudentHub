apiVersion: apps/v1
kind: Deployment
metadata:
  name: studenthub-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studenthub-web
  template:
    metadata:
      labels:
        app: studenthub-web
    spec:
      containers:
        - name: web
          image: studenthub-web:latest
          ports:
            - containerPort: 10000
          envFrom:
            - configMapRef:
                name: studenthub-config
            - secretRef:
                name: studenthub-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 30
