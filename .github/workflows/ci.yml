name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gates:
    name: Changed-Code Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_quality_gates.py

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run root test suite with coverage
        env:
          APP_ENV: testing
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: student_hub_test
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"
          REDIS_USERNAME: ""
          REDIS_PASSWORD: ""
          REDIS_SSL: "false"
        run: |
          pytest tests/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=html:coverage-root \
            -q

      - name: Run backend test suite with coverage
        env:
          APP_ENV: testing
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: student_hub_test
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"
          REDIS_USERNAME: ""
          REDIS_PASSWORD: ""
          REDIS_SSL: "false"
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=html:coverage-backend \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-root/
          retention-days: 7

  compose-smoke:
    name: Compose Image Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build web worker init-job
      - name: Start stack
        run: docker compose up -d mongo redis web worker
      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down -v
